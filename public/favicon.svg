<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgObsidian" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18191e"/>
      <stop offset="70%" stop-color="#0c0d10"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    <linearGradient id="apexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
    <linearGradient id="leftLegGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>
    <linearGradient id="rightLegGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <linearGradient id="emeraldBlade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Circular background (perfect for Google Search & browser circular crops) -->
  <circle cx="256" cy="256" r="240" fill="url(#bgObsidian)" stroke="#27272a" stroke-width="6"/>

  <!-- Upper Apex Delta Chevron -->
  <polygon points="256,105 336,245 292,245 256,182 220,245 176,245" fill="url(#apexGrad)"/>

  <!-- Lower Left Stealth Leg -->
  <polygon points="164,268 210,268 144,400 96,400" fill="url(#leftLegGrad)"/>

  <!-- Lower Right Stealth Leg -->
  <polygon points="302,268 348,268 416,400 368,400" fill="url(#rightLegGrad)"/>

  <!-- Central Floating Emerald Tech Blade -->
  <polygon points="176,312 336,312 322,342 190,342" fill="url(#emeraldBlade)" filter="url(#emeraldGlow)"/>

  <!-- Live NOC Status Pulse Dot -->
  <circle cx="256" cy="98" r="8" fill="#34d399" filter="url(#emeraldGlow)"/>
</svg>
