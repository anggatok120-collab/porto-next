<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" style="font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <radialGradient id="bgGlow" cx="70%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0e3a53"/>
      <stop offset="50%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#070c14"/>
    </radialGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30,41,59,0.7)"/>
      <stop offset="100%" stop-color="rgba(15,23,42,0.9)"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Tech Grid Lines -->
  <g stroke="rgba(56,189,248,0.06)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Circular Biofloc Tank Graphic Representation -->
  <g transform="translate(850, 315)">
    <!-- Aeration ripple waves -->
    <circle cx="0" cy="0" r="230" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="8 6"/>
    <circle cx="0" cy="0" r="180" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="70" fill="#0369a1" fill-opacity="0.3"/>
    <circle cx="0" cy="0" r="24" fill="#38bdf8" fill-opacity="0.7"/>

    <!-- Dynamic fish icons swimming in vortex -->
    <path d="M-60,-90 Q-40,-110 -20,-85 Q-40,-75 -60,-90 Z" fill="#38bdf8" opacity="0.8"/>
    <path d="M70,-70 Q100,-80 100,-50 Q80,-55 70,-70 Z" fill="#34d399" opacity="0.85"/>
    <path d="M90,50 Q110,80 80,90 Q75,70 90,50 Z" fill="#38bdf8" opacity="0.8"/>
    <path d="M-80,60 Q-100,85 -85,100 Q-70,80 -80,60 Z" fill="#34d399" opacity="0.8"/>
    <path d="M-130,-20 Q-150,-40 -120,-45 Q-115,-30 -130,-20 Z" fill="#38bdf8" opacity="0.7"/>

    <!-- Sensor / telemetry node -->
    <g transform="translate(110, -110)">
      <rect x="-10" y="-12" width="130" height="46" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="10" y="8" fill="#94a3b8" font-size="10">DO SENSOR</text>
      <text x="10" y="24" fill="#34d399" font-size="12" font-weight="700">6.8 mg/L · OK</text>
      <circle cx="105" cy="11" r="4" fill="#34d399"/>
    </g>

    <g transform="translate(-190, 110)">
      <rect x="-10" y="-12" width="130" height="46" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="10" y="8" fill="#94a3b8" font-size="10">BIOFLOC DENSITY</text>
      <text x="10" y="24" fill="#38bdf8" font-size="12" font-weight="700">850 ekor/m³</text>
      <circle cx="105" cy="11" r="4" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Left Content Box -->
  <g transform="translate(80, 140)">
    <!-- Pill tag -->
    <rect x="0" y="0" width="165" height="34" rx="17" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="20" cy="17" r="4" fill="#34d399"/>
    <text x="32" y="22" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.2">AKUAKULTUR &amp; SAINS</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#ffffff" font-size="38" font-weight="900" letter-spacing="-0.5">Pengaruh Padat Tebar</text>
    <text x="0" y="130" fill="url(#neonBlue)" font-size="36" font-weight="900" letter-spacing="-0.5">terhadap Pertumbuhan &amp; Sintasan</text>

    <!-- Subtitle description -->
    <text x="0" y="185" fill="#94a3b8" font-size="16" width="550">Analisis komparatif sistem bioflok vs konvensional, trade-off biomassa,</text>
    <text x="0" y="212" fill="#94a3b8" font-size="16" width="550">serta mitigasi 3 jalur pembatas kualitas air dalam budidaya intensif.</text>

    <!-- Meta badges -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="130" height="32" rx="6" fill="#1e293b"/>
      <text x="14" y="20" fill="#cbd5e1" font-size="12" font-weight="600">👤 Angga (UMM)</text>

      <rect x="142" y="0" width="115" height="32" rx="6" fill="#1e293b"/>
      <text x="156" y="20" fill="#cbd5e1" font-size="12" font-weight="600">⏱️ 5 Menit Baca</text>

      <rect x="269" y="0" width="125" height="32" rx="6" fill="#1e293b"/>
      <text x="283" y="20" fill="#34d399" font-size="12" font-weight="600">🐟 Lele &amp; Nila</text>
    </g>
  </g>
</svg>
