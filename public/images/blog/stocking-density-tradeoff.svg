<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="border-radius:12px;background:linear-gradient(135deg, #0e1726 0%, #08101a 100%);font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Title Badge & Header -->
  <rect x="40" y="30" width="150" height="26" rx="13" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1"/>
  <text x="115" y="47" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">STUDI KOMPARATIF</text>
  
  <text x="40" y="85" fill="#f8fafc" font-size="22" font-weight="800">Sistem Konvensional vs. Sistem Bioflok</text>
  <text x="40" y="108" fill="#94a3b8" font-size="13">Pengaruh adopsi teknologi terhadap padat tebar, sintasan (SR), dan efisiensi pakan (FCR)</text>

  <!-- Left Card: Konvensional -->
  <g transform="translate(40, 135)" filter="url(#shadow)">
    <rect width="395" height="300" rx="14" fill="#151e2e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Header Card -->
    <rect x="0" y="0" width="395" height="50" rx="14" fill="#1e293b" fill-opacity="0.6"/>
    <circle cx="30" cy="25" r="10" fill="#f59e0b" fill-opacity="0.2"/>
    <circle cx="30" cy="25" r="4" fill="#f59e0b"/>
    <text x="50" y="30" fill="#f1f5f9" font-size="15" font-weight="700">Budidaya Konvensional</text>
    <text x="365" y="30" text-anchor="end" fill="#94a3b8" font-size="12">Standar Air Tenang</text>

    <!-- Metrics -->
    <!-- Metric 1: Padat Tebar -->
    <g transform="translate(25, 75)">
      <text x="0" y="0" fill="#94a3b8" font-size="12">Kepadatan Tebar</text>
      <text x="0" y="24" fill="#fbbf24" font-size="20" font-weight="800">100 – 150 <tspan font-size="13" font-weight="500" fill="#cbd5e1">ekor/m³</tspan></text>
      <rect x="0" y="34" width="345" height="6" rx="3" fill="#334155"/>
      <rect x="0" y="34" width="70" height="6" rx="3" fill="url(#amberGrad)"/>
    </g>

    <!-- Metric 2: Kelangsungan Hidup (SR) -->
    <g transform="translate(25, 145)">
      <text x="0" y="0" fill="#94a3b8" font-size="12">Sintasan / Kelangsungan Hidup (SR)</text>
      <text x="0" y="24" fill="#f87171" font-size="20" font-weight="800">50% – 70%</text>
      <rect x="0" y="34" width="345" height="6" rx="3" fill="#334155"/>
      <rect x="0" y="34" width="180" height="6" rx="3" fill="#ef4444"/>
    </g>

    <!-- Metric 3: Rasio Konversi Pakan (FCR) -->
    <g transform="translate(25, 215)">
      <text x="0" y="0" fill="#94a3b8" font-size="12">Food Conversion Ratio (FCR)</text>
      <text x="0" y="24" fill="#cbd5e1" font-size="20" font-weight="800">&gt; 1,4 <tspan font-size="12" font-weight="400" fill="#f87171">(Boros pakan)</tspan></text>
      <rect x="0" y="34" width="345" height="6" rx="3" fill="#334155"/>
      <rect x="0" y="34" width="260" height="6" rx="3" fill="#f97316"/>
    </g>
  </g>

  <!-- Right Card: Bioflok -->
  <g transform="translate(465, 135)" filter="url(#shadow)">
    <rect width="395" height="300" rx="14" fill="#151e2e" stroke="rgba(56,189,248,0.25)" stroke-width="1.2"/>
    
    <!-- Header Card -->
    <rect x="0" y="0" width="395" height="50" rx="14" fill="#0369a1" fill-opacity="0.25"/>
    <circle cx="30" cy="25" r="10" fill="#10b981" fill-opacity="0.25"/>
    <circle cx="30" cy="25" r="4" fill="#10b981"/>
    <text x="50" y="30" fill="#f1f5f9" font-size="15" font-weight="700">Teknologi Bioflok</text>
    <text x="365" y="30" text-anchor="end" fill="#38bdf8" font-weight="600" font-size="12">Intensif &amp; Terkontrol</text>

    <!-- Metrics -->
    <!-- Metric 1: Padat Tebar -->
    <g transform="translate(25, 75)">
      <text x="0" y="0" fill="#94a3b8" font-size="12">Kepadatan Tebar</text>
      <text x="0" y="24" fill="#38bdf8" font-size="20" font-weight="800">500 – 1.000 <tspan font-size="13" font-weight="500" fill="#cbd5e1">ekor/m³</tspan> <tspan font-size="12" fill="#10b981">(Naik hingga 5-10x)</tspan></text>
      <rect x="0" y="34" width="345" height="6" rx="3" fill="#334155"/>
      <rect x="0" y="34" width="330" height="6" rx="3" fill="url(#blueGrad)"/>
    </g>

    <!-- Metric 2: Kelangsungan Hidup (SR) -->
    <g transform="translate(25, 145)">
      <text x="0" y="0" fill="#94a3b8" font-size="12">Sintasan / Kelangsungan Hidup (SR)</text>
      <text x="0" y="24" fill="#34d399" font-size="20" font-weight="800">Hingga 95% <tspan font-size="12" font-weight="400" fill="#10b981">(Mortalitas sangat rendah)</tspan></text>
      <rect x="0" y="34" width="345" height="6" rx="3" fill="#334155"/>
      <rect x="0" y="34" width="320" height="6" rx="3" fill="url(#emeraldGrad)"/>
    </g>

    <!-- Metric 3: Rasio Konversi Pakan (FCR) -->
    <g transform="translate(25, 215)">
      <text x="0" y="0" fill="#94a3b8" font-size="12">Food Conversion Ratio (FCR)</text>
      <text x="0" y="24" fill="#38bdf8" font-size="20" font-weight="800">~ 1,0 <tspan font-size="12" font-weight="400" fill="#10b981">(Hemat biaya pakan)</tspan></text>
      <rect x="0" y="34" width="345" height="6" rx="3" fill="#334155"/>
      <rect x="0" y="34" width="160" height="6" rx="3" fill="url(#emeraldGrad)"/>
    </g>
  </g>
</svg>
