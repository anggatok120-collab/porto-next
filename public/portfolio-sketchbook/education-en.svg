<g clip-path="url(#paper)"><rect x="90" y="270" width="790" height="700" fill="url(#left)"/><rect x="880" y="270" width="790" height="700" fill="url(#right)"/><rect x="90" y="270" width="1580" height="700" fill="transparent" filter="url(#grain)"/><text x="170" y="400" font-family="Georgia, serif" font-size="66" fill="#39352c"><tspan x="170" dy="0">Education</tspan></text><text x="170" y="580" font-family="Georgia, serif" font-size="35" fill="#39352c"><tspan x="170" dy="0">Pursuing higher education majoring</tspan><tspan x="170" dy="43">in Aquaculture (Fisheries) at</tspan><tspan x="170" dy="43">Universitas Muhammadiyah Malang</tspan><tspan x="170" dy="43">(UMM). Studying modern aquatic</tspan><tspan x="170" dy="43">cultivation technology, water</tspan><tspan x="170" dy="43">quality &amp; aquatic ecosystem</tspan><tspan x="170" dy="43">management, aquatic organism</tspan><tspan x="170" dy="43">nutrition, and the application of</tspan></text><text x="970" y="402" font-family="Georgia, serif" font-size="35" fill="#39352c"><tspan x="970" dy="0">IoT-based automation and</tspan><tspan x="970" dy="42">monitoring systems (Smart</tspan><tspan x="970" dy="42">Aquaculture).</tspan><tspan x="970" dy="42"></tspan><tspan x="970" dy="42">Computer and Network Engineering</tspan><tspan x="970" dy="42">(TKJ)</tspan><tspan x="970" dy="42"></tspan><tspan x="970" dy="42">Carried out computer network</tspan><tspan x="970" dy="42">practicum projects and server</tspan><tspan x="970" dy="42">administration as implementation</tspan><tspan x="970" dy="42">of technical skills in IT and</tspan><tspan x="970" dy="42">networking.</tspan><tspan x="970" dy="42"></tspan></text><path d="M880 278v684" stroke="#bbae96" stroke-width="1"/><text x="1580" y="928" text-anchor="end" font-family="Georgia,serif" font-size="24" fill="#827967">05</text></g></svg>