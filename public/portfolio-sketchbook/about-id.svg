<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1240" viewBox="0 0 1760 1240" role="img" aria-label="Tentang Saya">
<defs><linearGradient id="left"><stop stop-color="#fbf7ed"/><stop offset=".88" stop-color="#f5efdf"/><stop offset="1" stop-color="#d7cbb4"/></linearGradient><linearGradient id="right"><stop stop-color="#c6b99d"/><stop offset=".035" stop-color="#ede4d1"/><stop offset=".18" stop-color="#f8f2e5"/><stop offset="1" stop-color="#faf6eb"/></linearGradient><filter id="grain"><feTurbulence baseFrequency=".65" numOctaves="3" seed="7" type="fractalNoise"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".06"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter><clipPath id="paper"><rect x="90" y="270" width="1580" height="700" rx="20"/></clipPath><clipPath id="photo"><rect x="160" y="315" width="650" height="600" rx="8"/></clipPath></defs>
<g clip-path="url(#paper)"><rect x="90" y="270" width="790" height="700" fill="url(#left)"/><rect x="880" y="270" width="790" height="700" fill="url(#right)"/><rect x="90" y="270" width="1580" height="700" fill="transparent" filter="url(#grain)"/><text x="170" y="400" font-family="Georgia, serif" font-size="66" fill="#39352c"><tspan x="170" dy="0">Tentang Saya</tspan></text><text x="170" y="580" font-family="Georgia, serif" font-size="35" fill="#39352c"><tspan x="170" dy="0">Network Engineer dengan pengalaman</tspan><tspan x="170" dy="43">2,5+ tahun — 1,5 tahun karyawan di</tspan><tspan x="170" dy="43">NOC dan 1 tahun magang di Customer</tspan><tspan x="170" dy="43">Support, mencakup monitoring</tspan><tspan x="170" dy="43">jaringan dan customer support.</tspan><tspan x="170" dy="43"></tspan><tspan x="170" dy="43">Memiliki kompetensi dalam</tspan><tspan x="170" dy="43">monitoring jaringan,</tspan></text><text x="970" y="402" font-family="Georgia, serif" font-size="35" fill="#39352c"><tspan x="970" dy="0">troubleshooting network,</tspan><tspan x="970" dy="42">konfigurasi MikroTik, routing &amp;</tspan><tspan x="970" dy="42">switching, administrasi server</tspan><tspan x="970" dy="42">Linux, serta pengelolaan VLAN dan</tspan><tspan x="970" dy="42">firewall.</tspan><tspan x="970" dy="42"></tspan><tspan x="970" dy="42">Terbiasa bekerja dalam lingkungan</tspan><tspan x="970" dy="42">operasional jaringan yang dinamis</tspan><tspan x="970" dy="42">dengan kemampuan analisis, problem</tspan><tspan x="970" dy="42">solving, dan komunikasi yang baik.</tspan><tspan x="970" dy="42">Berkomitmen untuk menjaga</tspan><tspan x="970" dy="42">stabilitas infrastruktur IT dan</tspan><tspan x="970" dy="42">meningkatkan kualitas layanan.</tspan></text><path d="M880 278v684" stroke="#bbae96" stroke-width="1"/><text x="1580" y="928" text-anchor="end" font-family="Georgia,serif" font-size="24" fill="#827967">01</text></g></svg>